<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CRUD-Persons</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="table_container">
        <div id="form_container">
            <div class="form_group">
                <label class="form_label">Last Name:</label>
                <input type="text" id="form_nom" class="form_field"/>
            </div>
            <div class="form_group">
                <label class="form_label">First Name:</label>
                <input type="text" id="form_prenom" class="form_field"/>
            </div>
            <div class="form_group">
                <label class="form_label">Points:</label>
                <input type="number" id="form_points" class="form_field"/>
            </div>
            <button onclick="doNewData()">Add</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>No.</th>
                    <th>Last Name</th>
                    <th>First Name</th>
                    <th>Points</th>
                    <th>Select</th>
                </tr>
            </thead>
            <tbody id="table_body"></tbody>
        </table>
        <div id="container_summary">
            <p id="p1">0 row(s)</p>
            <p id="p2"></p>
            <p id="p3">Total point(s)= 0</p>
        </div>
        <button onclick="consoleTableau()">Console Table</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
